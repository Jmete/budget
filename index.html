<!doctype html>
<html lang="en-CA" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060707" />
    <meta name="description" content="Budget your salary, consulting income, investments and expenses with 2026 Ontario and federal tax estimates." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Toronto Budget Planner — 2026</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('tb.theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#ffffff');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
